name: Cross-Margin Top-8 Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "365"
      sma:
        description: "SMA period in days"
        required: false
        default: "30"
      maintenance_margin_pct:
        description: "Approx maintenance margin %% of notional per position"
        required: false
        default: "3"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy matplotlib

      - name: Run cross-margin backtest
        run: |
          python hl_short_top8_crossmargin.py \
            --days "${{ github.event.inputs.days || '365' }}" \
            --sma "${{ github.event.inputs.sma || '30' }}" \
            --maintenance-margin-pct "${{ github.event.inputs.maintenance_margin_pct || '3' }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossmargin-top8-${{ github.run_number }}
          path: |
            crossmargin_equity.csv
            crossmargin_trades.csv
            crossmargin_skipped_signals.csv
            crossmargin_liquidation_events.csv
            crossmargin_summary.png
          if-no-files-found: warn
          retention-days: 30
